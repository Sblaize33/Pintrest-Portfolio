<!DOCTYPE html>
<html>
<head>
    <title>My Pinterest Clone Project</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>    
    <div class="logo">P</div>

    <div class="search-bar">
      <input type="text" placeholder="Search for ideas..." />
    </div>

    <div class="nav-icons">
      <span>Home</span>
      <span>Explore</span>
      <span>Notifications</span>
    </div>
  </header>

   <div class="images">
       <div class="pin-card">
       <img src="Images/Man-coffee-mug.jpg" alt="man holding a coffee cup in a blue suit">
       <h3>Coffee Cup in Hand</h3>
       <button class="save-btn">Save</button>
    </div>
 
    <div class="pin-card">
        <img src="Images/Coffeemug.jpg" alt="a coffee cup on a table">
        <h3>A Coffee Cup on a Table</h3>
        <button class="save-btn">Save</button>
   </div>
  
   <div class="pin-card">  
        <img src="Images/Ladyanddog.jpg" alt="woman holding a dog and smiling">
        <h3>Woman with Her Dog</h3>
        <button class="save-btn">Save</button>
   </div>
  
   <div class="pin-card">  
        <img src="Images/Sandybeach.jpg" alt=" Sandy beach with a water plane on shore">
        <h3>Sandy White Beach</h3>
        <button class="save-btn">Save</button>
   </div>

    <div class="pin-card">  
        <img src="Images/Skillet.jpg" alt="Stuffed cabbage rolls in a skillet">
        <h3>Skillet Cabbage Roll Dinner</h3>
        <button class="save-btn">Save</button>
   </div>

    <div class="pin-card">  
        <img src="Images/Lynx.jpg" alt="Close-up portrait of a lynx">
        <h3>Lynx Portrait</h3>
        <button class="save-btn">Save</button>
   </div>

    <div class="pin-card">  
        <img src="Images/workspace.jpg" alt="People collaborating at a laptop in an office">
        <h3>Team Collaboration</h3>
        <button class="save-btn">Save</button>
   </div>

    <div class="pin-card">  
        <img src="Images/Mountain.jpg" alt="Snow-covered mountain landscape with forest">
        <h3>Mountain Landscape</h3>
        <button class="save-btn">Save</button>
   </div>

    <div class="pin-card">  
        <img src="Images/hans-pottery.jpg" alt="A stack of colorful, hand-painted ceramic bowls with vibrant blue, orange, and yellow patterns">
        <h3>Handcrafted Decorative Pottery</h3>
        <button class="save-btn">Save</button>
   </div>

  </div>
</body>
</html>
